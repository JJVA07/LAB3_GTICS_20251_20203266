<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        nav {
            background-color: #f0f0f0;
            padding: 12px;
            border-bottom: 1px solid #ccc;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #007bff;
        }
    </style>
</head>
<body>
<div th:fragment="navbar">
    <nav>
        <ul>
            <li><a th:href="@{/empleados}">Empleados</a></li>
            <li><a th:href="@{/historial}">Historial</a></li>
            <li><a th:href="@{/reportes}">Reportes</a></li>
        </ul>
    </nav>
</div>
</body>
</html>
